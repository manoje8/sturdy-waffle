[project]
name = "sturdy-waffle"
version = "0.1.0"
description = "Data structures and algorithms practice in Python"
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff>=0.11", "pre-commit>=4.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "notebook",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]
ignore = [
    "E741",
    "N802",
    "N806",
    "N999",
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["linked_list", "heaps", "trees", "sorting", "graph", "problems"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
