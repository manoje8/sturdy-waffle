[project]
name = "sturdy-waffle"
version = "0.1.0"
description = "Data structures and algorithms practice in Python"
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff>=0.11", "pre-commit>=4.0"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "notebook",
]

[tool.ruff.lint]
# E/W: pycodestyle   F: pyflakes   I: isort   N: pep8-naming
# UP: pyupgrade       B: flake8-bugbear   C4: flake8-comprehensions
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]
ignore = [
    "E741",   # ambiguous variable name (l, O, I) — common in algorithm code
    "N802",   # function name should be lowercase — LeetCode uses camelCase signatures
    "N806",   # variable in function should be lowercase — same reason
    "N999",   # invalid module name — files named after classes/problems (LRU.py, BNode.py)
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["linked_list", "heaps", "trees", "sorting", "graph", "problems"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
